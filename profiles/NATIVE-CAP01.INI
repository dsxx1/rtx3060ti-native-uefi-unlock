# Experimental exact-card native UEFI profile; see docs/NATIVE-CAP01.md.
# Native driver and GPU PROM SHA256 guards are compiled into this profile.
mode = manual
arch = ampere
board_id = 0x248910de
subsystem_id = 0x39031462
chip_id = 0x174000a1
pci_segment = 0
pci_bus = 1
pci_device = 0
pci_function = 0
strict_board = 1
strict_subsystem = 1
strict_chip = 1
strict_bdf = 1
strict_bar0 = 0
strict_esp = 0
windows_esp_guid = auto
allow_headless_handoff = 1
skip_gop_reconnect = 1
detach_console_consumers = 1
save_prom_dump = 1
